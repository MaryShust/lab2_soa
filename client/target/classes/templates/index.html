<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>LabWork SOA Client</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <h1>Клиент приложения LabWork</h1>
    <nav>
        <a th:href="@{/}">Коллекция</a>
        <a th:href="@{/labworks/new}">Добавить</a>
        <a th:href="@{/special/min-author}">Минимальный автор</a>
        <a th:href="@{/special/by-difficulty}">Подсчёт по сложности</a>
        <a th:href="@{/special/greater-than}">minimalPoint &gt; X</a>
    </nav>
</header>

<main>
    <div class="error" th:if="${error}" th:text="${error}"></div>
    <div class="message" th:if="${message}" th:text="${message}"></div>

    <h2>Коллекция лабораторных работ</h2>

    <form method="get" th:action="@{/}" class="filters">
        <label>Сортировка (sort)
            <input type="text" name="sort" th:value="${sort}"
                   placeholder="name:asc,coordinates.x:desc"/>
        </label>
        <label>Фильтр (filter)
            <input type="text" name="filter" th:value="${filter}"
                   placeholder="difficulty:eq:TERRIBLE,minimalPoint:gt:10"/>
        </label>
        <label>Страница
            <input type="number" name="page" min="1" th:value="${page}"/>
        </label>
        <label>Размер
            <input type="number" name="size" min="1" max="1000" th:value="${size}"/>
        </label>
        <button type="submit">Применить</button>
    </form>

    <p th:if="${emptyPage}" class="empty">Нет элементов на странице.</p>

    <table th:unless="${emptyPage}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Координаты</th>
            <th>Создано</th>
            <th>minimalPoint</th>
            <th>personalQualitiesMinimum</th>
            <th>averagePoint</th>
            <th>Сложность</th>
            <th>Автор</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lw : ${labWorks}">
            <td th:text="${lw.id}"></td>
            <td th:text="${lw.name}"></td>
            <td th:text="${lw.coordinates != null ? 'x=' + lw.coordinates.x + ', y=' + lw.coordinates.y : '—'}"></td>
            <td th:text="${lw.creationDate != null ? #temporals.format(lw.creationDate, 'yyyy-MM-dd HH:mm') : '—'}"></td>
            <td th:text="${lw.minimalPoint}"></td>
            <td th:text="${lw.personalQualitiesMinimum}"></td>
            <td th:text="${lw.averagePoint}"></td>
            <td th:text="${lw.difficulty}"></td>
            <td th:text="${lw.author != null ? lw.author.name : '—'}"></td>
            <td>
                <a th:href="@{'/labworks/' + ${lw.id}}">Открыть</a>
                <a th:href="@{'/labworks/' + ${lw.id} + '/edit'}">Изменить</a>
                <form method="post" th:action="@{'/labworks/' + ${lw.id} + '/delete'}"
                      style="display:inline">
                    <button type="submit" class="danger">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
